services:
  - type: web
    name: chattybot-grammar-correction
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT grammar_server:app
    envVars:
      - key: OPENAI_API_KEY
        sync: false  # set this in Render's dashboard
